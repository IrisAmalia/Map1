name: Dak woningmelder
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Stuur alleen een testmelding (ntfy + e-mail)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: dak-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright-core@1.48.0 nodemailer@6.9.16
      - name: Run melder
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_ADDRESS: ${{ secrets.MAIL_ADDRESS }}
          TEST_NOTIFICATION: ${{ inputs.test }}
        run: node scripts/watch.mjs
      - name: Bewaar gezien-lijst
        run: |
          git config user.name "dak-melder"
          git config user.email "dak-melder@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || (git commit -m "Update gezien-lijst" && git push)
