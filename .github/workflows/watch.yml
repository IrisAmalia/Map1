name: Dak woningmelder
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Stuur alleen een testmelding (ntfy + e-mail)"
        type: boolean
        default: false
      dry:
        description: "Proefmodus: hele controle draaien, maar niets versturen of bewaren"
        type: boolean
        default: false
      focus:
        description: "Diagnose: adressen (regex) waarvan je wilt zien wat elk filter zegt"
        type: string
        default: ""
permissions:
  contents: write
concurrency:
  # Een testmelding draait los van de gewone controles, zodat hij niet wordt geannuleerd als er een nieuwe controle klaarstaat.
  group: dak-watch${{ inputs.test && '-test' || '' }}
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # De nieuwste stand van de branch ophalen, niet de commit van het moment van inplannen.
      # Anders gebruikt een run die klaarstond terwijl de vorige liep een oude gezien-lijst en meldt hij dubbel.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm i --no-save playwright-core@1.48.0 nodemailer@6.9.16
      - name: Run melder
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_ADDRESS: ${{ secrets.MAIL_ADDRESS }}
          MAIL_EXTRA: ${{ secrets.MAIL_EXTRA }}
          DAK_USER: ${{ secrets.DAK_USER }}
          DAK_PASS: ${{ secrets.DAK_PASS }}
          TEST_NOTIFICATION: ${{ inputs.test }}
          DRY_RUN: ${{ inputs.dry }}
          FOCUS: ${{ inputs.focus }}
        run: node scripts/watch.mjs
      # NV Zeedijk meelezen: de eigen planning van GitHub draait soms maar eens in de paar uur, deze run elke minuut.
      # Elke 5 minuten (minuut 0, 5, 10, ...) is ruim genoeg voor die pagina. Een fout daar mag de Dak-melder niet stoppen.
      - name: NV Zeedijk (elke 5 minuten)
        if: ${{ !cancelled() && inputs.test != true && inputs.dry != true }}
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_ADDRESS: ${{ secrets.MAIL_ADDRESS }}
        run: |
          m=$(date -u +%-M)
          if [ $((m % 5)) -eq 0 ]; then node scripts/zeedijk.mjs; else echo "Minuut $m: NV Zeedijk nu niet aan de beurt."; fi
      - name: Bewaar gezien-lijst
        if: ${{ !cancelled() }}
        run: |
          git config user.name "dak-melder"
          git config user.email "dak-melder@users.noreply.github.com"
          git add state/seen.json
          [ -f state/zeedijk.json ] && git add state/zeedijk.json
          git diff --cached --quiet || (git commit -m "Update gezien-lijst" && (git push || (git pull --rebase && git push)))
