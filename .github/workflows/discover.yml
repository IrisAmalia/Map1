name: check-rules
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Advertentienummers (PublicatieId), gescheiden door komma's"
        default: "383139"
      full:
        description: "Ook de volledige paginatekst tonen"
        type: boolean
        default: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright-core@1.48.0
      - run: node scripts/check-rules.mjs
        env:
          IDS: ${{ inputs.ids }}
          FULL: ${{ inputs.full }}
