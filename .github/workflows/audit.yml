name: controle-alle-woningen
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright-core@1.48.0 nodemailer@6.9.16
      - run: node scripts/watch.mjs
        env:
          AUDIT: "true"
